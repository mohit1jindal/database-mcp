[project]
name = "oracle-mcp"
version = "0.1.0"
description = "Local stdio MCP server exposing a read-only Oracle database as native Claude tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.9",
    "oracledb>=2.4",
]

[project.scripts]
oracle-mcp = "oracle_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle_mcp"]
