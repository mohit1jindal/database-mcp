[project]
name = "database-mcp"
version = "0.3.0"
description = "Local stdio MCP server exposing a read-only SQL database (Oracle, PostgreSQL, MySQL, SQL Server, SQLite) as native Claude tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastmcp>=2.9",
    "sqlalchemy>=2.0",
    "oracledb>=2.4",        # Oracle driver (thin mode, no client install)
]

[project.optional-dependencies]
postgresql = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.1"]
mssql = ["pyodbc>=5.0"]     # also requires a system ODBC driver
all = ["psycopg2-binary>=2.9", "pymysql>=1.1", "pyodbc>=5.0"]

[project.scripts]
database-mcp = "database_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/database_mcp"]
